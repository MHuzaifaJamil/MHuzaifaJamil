<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130">
  <rect x="1" y="1" width="998" height="128" rx="6" fill="#0A0A0C" stroke="#B4182F" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite" />
  </rect>
  <g font-family="'Fira Code', Consolas, monospace" font-size="17" font-weight="600" fill="#FF3B3B" text-anchor="middle">
    <g>
      <animate attributeName="opacity" values="1;0.72;1" dur="2.6s" repeatCount="indefinite" />
      <text x="500.0" y="34">“Prepare against them what you (believers) can of (military) power and cavalry</text>
      <text x="500.0" y="58">to deter Allah's enemies and your enemies as well as other enemies unknown</text>
      <text x="500.0" y="82">to you but known to Allah.”</text>
    </g>
  </g>
  <g font-family="'Fira Code', Consolas, monospace" font-size="13" fill="#C98E00" text-anchor="middle">
    <text x="500.0" y="108">— Surah Al-Anfal, Ayah 60</text>
  </g>
</svg>
